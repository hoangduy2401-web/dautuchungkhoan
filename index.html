<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tổng gia sản</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap&subset=vietnamese,latin" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css?v=20260817a" />
</head>
<body>

  <!-- Shared nav across all 6 pages; rendered by assets/js/core/nav.js -->
  <div id="appNav"></div>

  <header class="app-header">
    <div class="brand">
      <div class="brand-top">
        <div class="mark">Tổng <span>gia sản</span></div>
      </div>
      <div class="sub">Tổng hợp 5 kênh đầu tư: chứng khoán · vàng · ngoại tệ · coin · tiết kiệm</div>
      <div class="clock" id="clock"></div>
    </div>
    <div class="header-right">
      <div class="controls">
        <div class="segmented">
          <button type="button" id="tLight">Sáng</button>
          <button type="button" id="tDark">Tối</button>
        </div>
      </div>
    </div>
  </header>

  <main class="main-grid-single">
    <!-- Tổng gia sản (GĐ 6) LÊN ĐẦU — trang này trả lời một câu hỏi: có bao
         nhiêu tài sản. Mọi công cụ (đăng nhập, sao lưu, chuyển dữ liệu, khoá mã)
         gom vào accordion cuối trang. Thứ tự trong panel CÓ CHỦ Ý: dải cảnh báo
         "chưa tính được kênh X" đứng TRÊN con số tổng. Xem tong.js. -->
    <div class="panel" id="nwPanel">
      <div class="panel-head">
        <h2>Tổng tài sản</h2>
        <div class="controls">
          <span class="nw-status" id="nwStatus"></span>
          <button type="button" class="btn-outline" id="nwReload">Tính lại</button>
        </div>
      </div>
      <div class="panel-body">
        <div id="nwAlerts"></div>
        <div class="nw-totals" id="nwTotals"></div>
        <div id="nwAlloc"></div>
        <!-- .asset-table-wrap = khuôn dùng chung cho bảng rộng (base.css), y như
             trang Tiết kiệm và Coin. Thiếu nó là mobile 375px tràn ngang. -->
        <div class="asset-table-wrap">
          <table class="asset-table">
            <thead>
              <tr>
                <th>Kênh</th>
                <th class="num">Số dòng</th>
                <th class="num">Giá trị</th>
                <th class="num">Tỷ trọng</th>
                <th class="num">Lãi/lỗ</th>
              </tr>
            </thead>
            <tbody id="nwTableBody"></tbody>
          </table>
        </div>
        <div id="nwFoot"></div>
        <!-- Nhãn nguồn của cả 5 kênh gom về đây thay vì nằm dưới từng tên kênh
             (mục 1.5 bắt buộc có nhãn, không bắt buộc đặt sát con số). -->
        <div id="nwSources"></div>
      </div>
    </div>

    <!-- Dòng tiền vào/ra (GĐ 6.4). Đặt SAU panel tổng vì nó giải thích con số
         ở trên: phần nào tăng do giá, phần nào chỉ là nạp thêm tiền. -->
    <div id="cfPanel"></div>

    <!-- Công cụ dữ liệu — gom 4 panel nền vào một accordion đóng sẵn. tong.js
         mở sẵn khi CHƯA đăng nhập (cần thấy ô đăng nhập) và đóng khi đã đăng
         nhập (trang sạch). Thứ tự bên trong: tài khoản trước, rồi các công cụ. -->
    <details class="panel tools-panel" id="toolsPanel">
      <summary id="toolsSummary">Tài khoản &amp; công cụ dữ liệu</summary>
      <div class="tools-body">
        <div id="authPanel"></div>
        <div id="pinPanel"></div>
        <div id="backupPanel"></div>
        <div id="migratePanel"></div>
      </div>
    </details>
  </main>

  <footer class="app-footer">
    Dữ liệu chỉ mang tính tham khảo, không phải khuyến nghị đầu tư.
    Quy hoạch đầy đủ ở <code>docs/QUYHOACH.md</code>.
  </footer>

  <!-- supabase-js: nạp từ unpkg với version ghim, y như lightweight-charts ở
       các trang biểu đồ. Đặt TRƯỚC auth.js — auth.js đọc window.supabase. -->
  <script src="https://unpkg.com/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
  <script src="assets/js/core/config.js?v=20260817a"></script>
  <script src="assets/js/core/store.js?v=20260817a"></script>
  <script src="assets/js/core/theme.js?v=20260817a"></script>
  <script src="assets/js/core/nav.js?v=20260817a"></script>
  <script src="assets/js/core/auth.js?v=20260817a"></script>
  <script src="assets/js/core/store-supabase.js?v=20260817a"></script>
  <script src="assets/js/core/backup.js?v=20260817a"></script>
  <script src="assets/js/core/migrate.js?v=20260817a"></script>
  <!-- Trang tổng cần đúng bộ nạp dữ liệu như các trang kênh: mockData ->
       dataService -> portfolio, rồi networth đứng trên cùng gom lại. -->
  <script src="assets/js/core/mockData.js?v=20260817a"></script>
  <script src="assets/js/core/dataService.js?v=20260817a"></script>
  <script src="assets/js/core/portfolio.js?v=20260817a"></script>
  <script src="assets/js/core/networth.js?v=20260817a"></script>
  <script src="assets/js/pages/tong.js?v=20260817a"></script>
</body>
</html>
